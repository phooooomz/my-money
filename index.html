<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker + CloudDB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <div class="max-w-4xl mx-auto p-4 md:p-6 pb-20">
    <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-emerald-500 text-white rounded-xl flex items-center justify-center font-bold text-xl">
          <i class="fa-solid fa-cloud"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-800">บันทึกรายรับ-รายจ่าย</h1>
          <p class="text-xs text-slate-500">ซิงค์ข้อมูลผ่าน Cloudflare D1</p>
        </div>
      </div>
    </header>

    <!-- Dashboard -->
    <div class="grid grid-cols-3 gap-3 md:gap-4 mb-6">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <p class="text-xs text-slate-500 font-medium mb-1">รายรับรวม</p>
        <p id="total-income" class="text-base md:text-xl font-bold text-emerald-600">฿0.00</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <p class="text-xs text-slate-500 font-medium mb-1">รายจ่ายรวม</p>
        <p id="total-expense" class="text-base md:text-xl font-bold text-rose-500">฿0.00</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <p class="text-xs text-slate-500 font-medium mb-1">คงเหลือ</p>
        <p id="total-balance" class="text-base md:text-xl font-bold text-slate-800">฿0.00</p>
      </div>
    </div>

    <!-- AI Input -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-4 rounded-2xl shadow-md text-white mb-6">
      <label class="block text-xs font-semibold mb-2 flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> AI บันทึกด่วนด้วยคำพูด
      </label>
      <div class="flex gap-2">
        <input type="text" id="ai-input" placeholder="เช่น ค่ากาแฟ 65 บาท" class="flex-1 px-3 py-2 text-slate-800 rounded-xl text-sm focus:outline-none">
        <button onclick="processAIInput()" id="ai-btn" class="bg-slate-900 hover:bg-slate-800 px-4 py-2 rounded-xl text-xs font-semibold transition shrink-0">บันทึก</button>
      </div>
    </div>

    <!-- Form & History -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-blue-500"></i> เพิ่มรายการใหม่
        </h2>
        <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-3">
          <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
            <button type="button" id="btn-type-expense" onclick="setType('expense')" class="py-1.5 rounded-lg text-xs font-semibold transition bg-white text-rose-500 shadow-sm">รายจ่าย</button>
            <button type="button" id="btn-type-income" onclick="setType('income')" class="py-1.5 rounded-lg text-xs font-semibold transition text-slate-600">รายรับ</button>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">จำนวนเงิน (บาท)</label>
            <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">หมวดหมู่</label>
            <input list="category-list" id="category" required placeholder="เลือกหรือพิมพ์หมวดหมู่..." class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <datalist id="category-list"></datalist>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">หมายเหตุ</label>
            <input type="text" id="note" placeholder="คำอธิบายเพิ่มเติม..." class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-xl text-sm transition">บันทึกรายการ</button>
        </form>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-sm font-bold text-slate-800">ประวัติรายการ (จาก Cloud)</h2>
          <button onclick="analyzeFinances()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-2.5 py-1 rounded-lg transition font-medium">
            <i class="fa-solid fa-brain mr-1"></i> AI วิเคราะห์
          </button>
        </div>
        <div id="transaction-list" class="space-y-2 overflow-y-auto max-h-[280px] flex-1 pr-1"></div>
      </div>
    </div>
  </div>

  <script>
    // ถ้าหน้าเว็บและ Worker อยู่ภายใต้โดเมนเดียวกันผ่าน Pages Functions ให้ใช้ "/api" ได้เลยครับ
    const API_BASE = "";

    let transactions = [];
    let currentType = 'expense';

    const defaultCategories = {
      expense: ['อาหาร/เครื่องดื่ม', 'เดินทาง', 'ช้อปปิ้ง', 'บิล/ค่าน้ำไฟ', 'บันเทิง'],
      income: ['เงินเดือน', 'ฟรีแลนซ์', 'ขายของ', 'การลงทุน', 'โบนัส']
    };

    window.onload = () => {
      updateCategories();
      fetchTransactions();
    };

    function setType(type) {
      currentType = type;
      document.getElementById('btn-type-expense').className = type === 'expense' ? 'py-1.5 rounded-lg text-xs font-semibold transition bg-white text-rose-500 shadow-sm' : 'py-1.5 rounded-lg text-xs font-semibold transition text-slate-600';
      document.getElementById('btn-type-income').className = type === 'income' ? 'py-1.5 rounded-lg text-xs font-semibold transition bg-white text-emerald-600 shadow-sm' : 'py-1.5 rounded-lg text-xs font-semibold transition text-slate-600';
      updateCategories();
    }

    function updateCategories() {
      const datalist = document.getElementById('category-list');
      datalist.innerHTML = defaultCategories[currentType].map(cat => `<option value="${cat}">`).join('');
    }

    async function fetchTransactions() {
      try {
        const res = await fetch(`${API_BASE}/api/transactions`);
        transactions = await res.json();
        renderUI();
      } catch (err) {
        console.error(err);
      }
    }

    async function addTransaction(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;
      const note = document.getElementById('note').value;

      try {
        await fetch(`${API_BASE}/api/transactions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount, type: currentType, category, note })
        });
        document.getElementById('transaction-form').reset();
        fetchTransactions();
      } catch (err) {
        alert('บันทึกข้อมูลไม่สำเร็จ');
      }
    }

    async function deleteTransaction(id) {
      try {
        await fetch(`${API_BASE}/api/transactions/${id}`, { method: 'DELETE' });
        fetchTransactions();
      } catch (err) {
        alert('ลบรายการไม่สำเร็จ');
      }
    }

    function renderUI() {
      const list = document.getElementById('transaction-list');
      let income = 0, expense = 0;

      list.innerHTML = transactions.length === 0 ? '<p class="text-xs text-slate-400 text-center py-8">ยังไม่มีรายการบันทึก</p>' : '';

      transactions.forEach(t => {
        if (t.type === 'income') income += t.amount;
        else expense += t.amount;

        list.innerHTML += `
          <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl hover:bg-slate-100 transition">
            <div>
              <p class="text-xs font-bold text-slate-700">${t.category} ${t.note ? `<span class="font-normal text-slate-400">(${t.note})</span>` : ''}</p>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-500'}">
                ${t.type === 'income' ? '+' : '-'}฿${t.amount.toLocaleString()}
              </span>
              <button onclick="deleteTransaction(${t.id})" class="text-slate-300 hover:text-rose-500 text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      });

      document.getElementById('total-income').innerText = `฿${income.toLocaleString()}`;
      document.getElementById('total-expense').innerText = `฿${expense.toLocaleString()}`;
      document.getElementById('total-balance').innerText = `฿${(income - expense).toLocaleString()}`;
    }

    async function processAIInput() {
      const input = document.getElementById('ai-input').value;
      if (!input) return;
      const btn = document.getElementById('ai-btn');
      btn.innerText = 'กำลังประมวลผล...';

      const prompt = `วิเคราะห์ข้อความการเงิน: "${input}" ตอบเป็น JSON เท่านั้น รูปแบบ: {"amount": ตัวเลข, "type": "income" หรือ "expense", "category": "หมวดหมู่", "note": "หมายเหตุ"}`;
      
      try {
        const res = await fetch(`${API_BASE}/api/ai`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        const text = data.candidates[0].content.parts[0].text;
        const result = JSON.parse(text.replace(/```json|```/g, '').trim());

        await fetch(`${API_BASE}/api/transactions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(result)
        });

        document.getElementById('ai-input').value = '';
        fetchTransactions();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการประมวลผล AI');
      } finally {
        btn.innerText = 'บันทึก';
      }
    }

    async function analyzeFinances() {
      if (transactions.length === 0) return alert('โปรดเพิ่มรายการการเงินก่อนครับ');
      alert('AI กำลังวิเคราะห์ข้อมูลการเงินของคุณ...');
      
      const prompt = `วิเคราะห์ประวัติการเงินนี้: ${JSON.stringify(transactions)} ให้สรุปสั้นๆ และแนะนำการประหยัดเงิน 2 ข้อ`;
      try {
        const res = await fetch(`${API_BASE}/api/ai`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        alert(data.candidates[0].content.parts[0].text);
      } catch (err) {
        alert('วิเคราะห์ไม่สำเร็จ');
      }
    }
  </script>
</body>
</html>
