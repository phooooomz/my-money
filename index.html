<!DOCTYPE html>
<html lang="th" class="h-full bg-[#0c0d0e] text-[#f0f2f5]">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Tab Navigation Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Prompt', sans-serif;
  }
  
  .tab-btn {
    color: #9ca3af;
    position: relative;
    cursor: pointer;
  }

  .tab-btn-active {
    color: #f0f2f5 !important;
    font-weight: 500;
  }

  /* Smooth Elastic Tab Content Animations */
  .tab-content {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .tab-content.tab-hidden {
    display: none !important;
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }

  .tab-content.tab-entering {
    animation: tabEnter 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes tabEnter {
    0% {
      opacity: 0;
      transform: translateY(14px) scale(0.97);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
</style>
</head>
<body class="min-h-full flex flex-col items-center justify-center p-6 bg-[#0c0d0e]">

<div class="w-full max-w-lg bg-[#16181a] border border-[#272a2e] p-6 rounded-3xl shadow-2xl flex flex-col gap-6">
  
  <!-- Header & Dynamic Tab Bar -->
  <header class="flex items-center justify-between pb-4 border-b border-[#272a2e]">
    <div>
      <h1 class="text-base font-semibold text-[#f0f2f5]">ระบบบัญชีรายรับ-รายจ่าย</h1>
      <p class="text-xs text-[#9ca3af]">ทดลองกดสลับแท็บเพื่อดูอนิเมชั่น</p>
    </div>

    <!-- Navigation Bar with Elastic Line Indicator -->
    <div class="relative">
      <nav id="tab-nav" class="flex gap-4 text-sm font-medium text-[#9ca3af]">
        <button id="tab-app-btn" onclick="switchTab('app')" class="tab-btn pb-2 tab-btn-active transition-colors">
          บันทึกบัญชี
        </button>
        <button id="tab-summary-btn" onclick="switchTab('summary')" class="tab-btn pb-2 hover:text-[#f0f2f5] transition-colors">
          สรุปสถิติ
        </button>
        <button id="tab-ai-btn" onclick="switchTab('ai')" class="tab-btn pb-2 hover:text-[#f0f2f5] transition-colors">
          คุยกับ AI
        </button>
      </nav>
      <!-- Sliding Line Indicator -->
      <div id="tab-indicator" class="absolute bottom-0 h-0.5 bg-[#f0f2f5] transition-all duration-300 ease-out"></div>
    </div>
  </header>

  <!-- TAB 1: APP CONTENT -->
  <main id="tab-app" class="tab-content flex flex-col gap-4">
    <div class="p-4 rounded-2xl bg-[#0c0d0e] border border-[#272a2e] text-center">
      <span class="text-xs text-[#9ca3af]">หน้าต่างบันทึกบัญชี</span>
      <div class="text-2xl font-bold text-emerald-400 mt-1">฿12,500.00</div>
    </div>
  </main>

  <!-- TAB 2: SUMMARY CONTENT -->
  <main id="tab-summary" class="tab-content tab-hidden flex flex-col gap-4">
    <div class="p-4 rounded-2xl bg-[#0c0d0e] border border-[#272a2e] text-center">
      <span class="text-xs text-[#9ca3af]">หน้าต่างสรุปสถิติ</span>
      <div class="w-full bg-[#16181a] h-3 rounded-full mt-3 overflow-hidden flex border border-[#272a2e]">
        <div class="bg-emerald-500 h-full w-[65%]"></div>
        <div class="bg-rose-500 h-full w-[35%]"></div>
      </div>
    </div>
  </main>

  <!-- TAB 3: AI CONTENT -->
  <main id="tab-ai" class="tab-content tab-hidden flex flex-col gap-4">
    <div class="p-4 rounded-2xl bg-[#0c0d0e] border border-[#272a2e] text-center">
      <span class="text-xs text-[#9ca3af]">หน้าต่างผู้ช่วย AI</span>
      <div class="text-sm text-[#f0f2f5] mt-2">🤖 สวัสดีครับ มีอะไรให้ AI ช่วยสรุปใหมครับ?</div>
    </div>
  </main>

</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    updateTabIndicator();
    window.addEventListener('resize', updateTabIndicator);
  });

  function getEl(id) {
    return document.getElementById(id);
  }

  function updateTabIndicator() {
    const activeBtn = document.querySelector('.tab-btn-active');
    const indicator = getEl('tab-indicator');
    const nav = getEl('tab-nav');

    if (activeBtn && indicator && nav) {
      const navRect = nav.getBoundingClientRect();
      const btnRect = activeBtn.getBoundingClientRect();

      indicator.style.width = `${btnRect.width}px`;
      indicator.style.left = `${btnRect.left - navRect.left}px`;
    }
  }

  function switchTab(tabName) {
    const tabs = {
      app: { content: getEl('tab-app'), btn: getEl('tab-app-btn') },
      summary: { content: getEl('tab-summary'), btn: getEl('tab-summary-btn') },
      ai: { content: getEl('tab-ai'), btn: getEl('tab-ai-btn') }
    };

    Object.keys(tabs).forEach(key => {
      const item = tabs[key];
      if (!item.content || !item.btn) return;

      if (key === tabName) {
        item.btn.classList.add('tab-btn-active');
        item.content.classList.remove('tab-hidden');
        
        item.content.classList.remove('tab-entering');
        void item.content.offsetWidth;
        item.content.classList.add('tab-entering');
      } else {
        item.btn.classList.remove('tab-btn-active');
        item.content.classList.add('tab-hidden');
        item.content.classList.remove('tab-entering');
      }
    });

    updateTabIndicator();
  }
</script>
</body>
</html>
