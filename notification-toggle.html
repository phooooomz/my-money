<!DOCTYPE html>
<html lang="th" class="bg-[#0c0d0e] text-[#f0f2f5]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Toggle Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-[#16181a] border border-[#272a2e] rounded-2xl p-5 shadow-2xl flex flex-col gap-4">
        
        <div class="flex items-center justify-between pb-3 border-b border-[#272a2e]">
            <div>
                <h3 class="text-base font-medium text-[#f0f2f5]">ตั้งค่าการแจ้งเตือน</h3>
                <p class="text-xs text-[#9ca3af]">สรุปรายวัน 18:00 น. และรายสัปดาห์</p>
            </div>
            
            <!-- Dynamic Status Badge -->
            <div id="status-badge" class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-[#272a2e] text-[#9ca3af]">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-[#9ca3af]"></span>
                <span id="status-text">ปิดใช้งาน</span>
            </div>
        </div>

        <!-- Notification Control Panel -->
        <div class="flex flex-col gap-3">
            
            <!-- Main Action Button -->
            <button 
                id="btn-toggle-notif" 
                onclick="handleNotificationClick()" 
                class="w-full py-3 px-4 rounded-xl text-sm font-medium bg-[#f0f2f5] text-[#0c0d0e] hover:bg-[#d1d5db] active:scale-[0.98] transition flex items-center justify-center gap-2 shadow"
            >
                🔔 เปิดการแจ้งเตือน
            </button>

            <!-- Test Trigger Button (Visible only when granted) -->
            <button 
                id="btn-test-notif" 
                onclick="sendTestNotification()" 
                class="hidden w-full py-2.5 px-4 rounded-xl text-xs font-medium border border-emerald-900/60 bg-emerald-950/30 text-emerald-400 hover:bg-emerald-950/60 transition flex items-center justify-center gap-2"
            >
                ⚡ ยิงทดสอบการแจ้งเตือนทันที
            </button>

            <!-- Instruction Banner for Blocked State -->
            <div id="blocked-help" class="hidden bg-rose-950/30 border border-rose-900/50 rounded-xl p-3 text-xs text-rose-300 leading-relaxed">
                ⚠️ <strong>การแจ้งเตือนถูกบล็อกอยู่:</strong><br>
                โปรดคลิกไอคอน 🔒 หรือ 🛠️ ด้านซ้ายของแถบ URL ด้านบนสุด -> แล้วเปลี่ยนสิทธิ์ <strong>การแจ้งเตือน (Notifications)</strong> ให้เป็น <strong>"อนุญาต (Allow)"</strong>
            </div>

        </div>

    </div>

    <!-- Embedded Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkNotificationPermission();
        });

        // 1. Check current permission state on page load
        function checkNotificationPermission() {
            if (!("Notification" in window)) {
                updateUI('unsupported');
                return;
            }

            const permission = Notification.permission;
            updateUI(permission);
        }

        // 2. Handle button click logic
        async function handleNotificationClick() {
            if (!("Notification" in window)) {
                alert("เบราว์เซอร์ของคุณไม่รองรับระบบการแจ้งเตือน");
                return;
            }

            if (Notification.permission === 'granted') {
                alert("การแจ้งเตือนเปิดใช้งานอยู่แล้วครับ");
                return;
            }

            if (Notification.permission === 'denied') {
                document.getElementById('blocked-help').classList.remove('hidden');
                return;
            }

            try {
                // Request Browser Permission Prompt
                const result = await Notification.requestPermission();
                updateUI(result);

                if (result === 'granted') {
                    sendTestNotification("เปิดการแจ้งเตือนสำเร็จ!", "ระบบจะส่งสรุปรายรับ-รายจ่ายให้คุณทุกวัน เวลา 18:00 น.");
                }
            } catch (err) {
                console.error("Permission error:", err);
            }
        }

        // 3. Update UI states based on permission
        function updateUI(state) {
            const badge = document.getElementById('status-badge');
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const mainBtn = document.getElementById('btn-toggle-notif');
            const testBtn = document.getElementById('btn-test-notif');
            const helpBox = document.getElementById('blocked-help');

            if (state === 'granted') {
                badge.className = "flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-950/50 border border-emerald-900/60 text-emerald-400";
                dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                text.textContent = "เปิดใช้งานแล้ว";

                mainBtn.textContent = "✓ อนุญาตการแจ้งเตือนแล้ว";
                mainBtn.className = "w-full py-3 px-4 rounded-xl text-sm font-medium bg-[#272a2e] text-[#9ca3af] cursor-default opacity-80 flex items-center justify-center gap-2";

                testBtn.classList.remove('hidden');
                helpBox.classList.add('hidden');
            } else if (state === 'denied') {
                badge.className = "flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-rose-950/50 border border-rose-900/60 text-rose-400";
                dot.className = "w-2 h-2 rounded-full bg-rose-500";
                text.textContent = "ถูกบล็อกสิทธิ์";

                mainBtn.textContent = "⚠️ สิทธิ์ถูกบล็อก (คลิกเพื่อดูวิธีแก้)";
                mainBtn.className = "w-full py-3 px-4 rounded-xl text-sm font-medium bg-rose-900/30 border border-rose-800/50 text-rose-300 hover:bg-rose-900/50 transition flex items-center justify-center gap-2";

                testBtn.classList.add('hidden');
                helpBox.classList.remove('hidden');
            } else { // default / prompt
                badge.className = "flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-[#272a2e] text-[#9ca3af]";
                dot.className = "w-2 h-2 rounded-full bg-[#9ca3af]";
                text.textContent = "ปิดใช้งาน";

                mainBtn.textContent = "🔔 เปิดการแจ้งเตือน";
                mainBtn.className = "w-full py-3 px-4 rounded-xl text-sm font-medium bg-[#f0f2f5] text-[#0c0d0e] hover:bg-[#d1d5db] active:scale-[0.98] transition flex items-center justify-center gap-2 shadow";

                testBtn.classList.add('hidden');
                helpBox.classList.add('hidden');
            }
        }

        // 4. Send test notification
        async function sendTestNotification(title = "🔔 สรุปรายรับ-รายจ่าย (18:00 น.)", body = "ทดสอบการส่งข้อความแจ้งเตือนสำเร็จ!") {
            if (Notification.permission !== 'granted') {
                alert("กรุณาเปิดการแจ้งเตือนก่อนทดสอบครับ");
                return;
            }

            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                const reg = await navigator.serviceWorker.ready;
                reg.showNotification(title, {
                    body: body,
                    icon: "/icon-192.png",
                    badge: "/icon-192.png"
                });
            } else {
                new Notification(title, { body: body });
            }
        }
    </script>
</body>
</html>
